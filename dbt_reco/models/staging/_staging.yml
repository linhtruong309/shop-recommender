version: 2

models:
  - name: stg_events
    columns:
      - name: event_at
        data_tests: [not_null]
      - name: visitor_id
        data_tests: [not_null]
      - name: item_id
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["view", "addtocart", "transaction"]
  - name: stg_category_tree
    columns:
      - name: category_id
        data_tests: [unique, not_null]
