version: 2

models:
  - name: fct_user_item_interactions
    description: One row per visitor-item pair; training data for the Two-Tower model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [visitor_id, item_id]
    columns:
      - name: interaction_score
        data_tests: [not_null]
