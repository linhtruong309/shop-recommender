name: dbt_reco
version: "1.0.0"
config-version: 2
profile: dbt_reco

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  session_timeout_minutes: 30

models:
  dbt_reco:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
